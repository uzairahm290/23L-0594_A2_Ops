name: 23l-0594_a2_ops

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data       # named volume: survives `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # no `ports:` on purpose - Postgres is only reachable as db:5432 inside the compose network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # `-` not `:-`: an empty TF_PACKAGE (remote backend) must stay empty, not fall back to TF
        TF_PACKAGE: ${TF_PACKAGE-tensorflow-cpu==2.20.0}
    image: 23l-0594-a2-ops-web:latest
    # only the variables this service needs (the DagsHub token in .env never reaches it)
    environment:
      # service name `db` resolves through Compose's internal DNS
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MODEL_PATH: /models/champion/model.keras
      SECRET_KEY: ${SECRET_KEY}
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-local}
      THRESHOLD: ${THRESHOLD:-0.5}
      MODEL_NAME: ${MODEL_NAME:-23L-0594_A2_Ops_visionguard}
      MODEL_VERSION: ${MODEL_VERSION:-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-4}
      MODEL_API_URL: ${MODEL_API_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    volumes:
      # model mounted read-only rather than baked in: swapping the champion doesn't need a rebuild,
      # and the image stays free of a ~10 MB binary that changes on a different schedule than code
      - ./models/champion:/models/champion:ro
    depends_on:
      db:
        condition: service_healthy            # wait until pg_isready passes, not just "started"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
